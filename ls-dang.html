<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn Lịch sử Đảng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f3f6fb;--surface:#fff;--ink:#14213d;--muted:#5b6784;--line:#d5dcea;--accent:#1d4ed8;--accent-ink:#fff;--ok:#0f8a4f;--ok-bg:#dff5e9;--bad:#c62828;--bad-bg:#fde4e2;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#18203a;--ink:#e8edfb;--muted:#9aa6c6;--line:#2a3558;--accent:#6c9bff;--accent-ink:#0e1424;--ok:#4cd68b;--ok-bg:#12372a;--bad:#ff8a80;--bad-bg:#3d1b1b;--warn:#f5b45a}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#18203a;--ink:#e8edfb;--muted:#9aa6c6;--line:#2a3558;--accent:#6c9bff;--accent-ink:#0e1424;--ok:#4cd68b;--ok-bg:#12372a;--bad:#ff8a80;--bad-bg:#3d1b1b;--warn:#f5b45a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.15;margin:8px 0 6px;font-weight:800}
p.sub{color:var(--muted);margin:0 0 22px}
.menu{display:grid;gap:12px}
.mode{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;cursor:pointer}
.mode:hover,.mode:focus-visible{border-color:var(--accent);outline:none}
.mode b{display:block;font-size:1.05rem}
.mode span{color:var(--muted);font-size:.92rem}
.best{margin-top:18px;color:var(--muted);font-size:.92rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.92rem;color:var(--muted)}
.top .grow{flex:1}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stats{display:flex;gap:16px;font-weight:700;color:var(--ink)}
.stats .streak{color:var(--warn)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
.qno{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:700;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--accent);outline:none}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:var(--accent-ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:var(--accent-ink)}
.fb{margin-top:14px;font-weight:700;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font-size:clamp(2.6rem,12vw,4rem);font-weight:800;margin:6px 0}
.rev{margin-top:20px;display:grid;gap:12px}
.rev .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.95rem}
.rev .item small{color:var(--muted)}
.rev .item .y{color:var(--ok);font-weight:700}
.rev .item .n{color:var(--bad);font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<section id="menu">
  <h1>Ôn Lịch sử Đảng</h1>
  <p class="sub">263 câu trắc nghiệm, chia 3 chương. Chọn đáp án, xem đúng sai ngay, ôn lại câu làm sai.</p>
  <div class="menu">
    <button class="mode" data-mode="20"><b>Lượt nhanh: 20 câu ngẫu nhiên</b><span>Ôn mỗi ngày một chút.</span></button>
    <button class="mode" data-mode="50"><b>Lượt vừa: 50 câu ngẫu nhiên</b><span>Khoảng 10–15 phút.</span></button>
    <button class="mode" data-mode="ch1"><b>Chương 1: Đảng ra đời (1930–1945)</b><span>95 câu, xáo thứ tự.</span></button>
    <button class="mode" data-mode="ch2"><b>Chương 2: Hai cuộc kháng chiến (1945–1975)</b><span>111 câu, xáo thứ tự.</span></button>
    <button class="mode" data-mode="ch3"><b>Chương 3: Quá độ lên CNXH và đổi mới</b><span>57 câu, xáo thứ tự.</span></button>
    <button class="mode" data-mode="all"><b>Cả đề: 263 câu, xáo thứ tự</b><span>Làm hết một lượt.</span></button>
    <button class="mode" data-mode="seq"><b>Làm theo thứ tự đề</b><span>Giữ nguyên thứ tự câu và đáp án như file gốc.</span></button>
    <button class="mode hidden" id="wrongMode" data-mode="wrong"><b>Ôn lại các câu từng sai</b><span id="wrongCount"></span></button>
  </div>
  <p class="best" id="best"></p>
</section>

<section id="game" class="hidden">
  <div class="top">
    <button class="btn ghost" id="quit" style="padding:6px 12px">Thoát</button>
    <span class="grow" id="prog"></span>
    <span class="stats"><span id="sc">0 đúng</span><span class="streak" id="st"></span></span>
  </div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="qcard">
    <div class="qno" id="qno"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn hidden" id="next">Câu tiếp</button></div>
  </div>
</section>

<section id="end" class="hidden">
  <h1 id="endTitle"></h1>
  <div class="score" id="endScore"></div>
  <p class="sub" id="endSub"></p>
  <div class="row">
    <button class="btn" id="again">Chơi lại</button>
    <button class="btn ghost" id="retryWrong">Làm lại câu sai</button>
    <button class="btn ghost" id="home">Về menu</button>
  </div>
  <div class="rev" id="rev"></div>
</section>
</main>
<script>
const Q = [{"n": 1, "ch": 1, "label": "Chương 1 · câu 1", "q": "chính quyền (1930-1945) Đảng cộng sản Việt Nam do Chủ tịch Hồ Chí Minh sáng lập:", "opts": ["3/4/1930", "3/2/1930", "20/3/1930", "15/3/1930"], "c": 1}, {"n": 2, "ch": 1, "label": "Chương 1 · câu 2", "q": "Đảng cộng sản Việt Nam là đội tiên phong của?", "opts": ["Giai cấp công nhân; nhân dân lao động; của dân tộc Việt Nam", "Giai cấp nông dân; nhân dân lao động; của dân tộc Việt Nam", "Giai cấp tư sản; nhân dân lao động; của dân tộc Việt Nam", "Giai cấp tiểu tư sản; nhân dân lao động; của dân tộc Việt Nam"], "c": 0}, {"n": 3, "ch": 1, "label": "Chương 1 · câu 3", "q": "Nền tảng tư tưởng, kim chỉ nam của Đảng ta?", "opts": ["Chủ nghĩa Mác – Lênin, Tư tưởng Hồ Chí Minh", "Chủ nghĩa Mác – Lênin, Tư tưởng giai cấp nông dân", "Chủ nghĩa Mác – Lênin, Tư tưởng nhân dân", "Chủ nghĩa Mác – Lênin, Tư tưởng giai cấp công nhân"], "c": 0}, {"n": 4, "ch": 1, "label": "Chương 1 · câu 4", "q": "Lịch sử Đảng cộng sản Việt Nam là một chuyên ngành, một bộ phận của:", "opts": ["Khoa học lịch sử", "Khoa học tự nhiên", "Triết học", "Văn học"], "c": 0}, {"n": 5, "ch": 1, "label": "Chương 1 · câu 5", "q": "Đối tượng nghiên cứu của khoa học lịch sử là:", "opts": ["Sự ra đời, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử", "Sự ra đời của giai cấp công nhân, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử", "Sự ra đời của giai cấp nông dân, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử", "Sự ra đời của tư sản, phát triển và hoạt động lãnh đạo của Đảng qua các"], "c": 0}, {"n": 6, "ch": 1, "label": "Chương 1 · câu 6", "q": "thời kỳ Nghiên cứu lịch sử Đảng là:", "opts": ["Làm rõ hệ thống tổ chức Đảng, công tác cây dựng Đảng qua các thời kỳ lịch sử", "Nêu cao hiểu biết", "Xây dựng đạo đức", "Hoàn thiện nhân cách"], "c": 0}, {"n": 7, "ch": 1, "label": "Chương 1 · câu 7", "q": "Chức năng của khoa học lịch sử Đảng?", "opts": ["Chức năng nhận thức", "Chức năng giáo dục", "Chức năng dự báo và phê phán", "Tất cả đều đúng"], "c": 3}, {"n": 8, "ch": 1, "label": "Chương 1 · câu 8", "q": "Một trong những nhiệm vụ của khoa học Lịch sử Đảng là:", "opts": ["Trình bày có hệ thống Cương lĩnh, đường lối của Đảng", "Trình bày có hệ thống Cương lĩnh, đường lối của nhân dân", "Trình bày có hệ thống Cương lĩnh, đường lối giai cấp tư sản", "Trình bày có hệ thống Cương lĩnh, đường lối của cán bộ Đảng viên"], "c": 0}, {"n": 9, "ch": 1, "label": "Chương 1 · câu 9", "q": "Phương pháp nghiên cứu, học tập môn lịch sử Đảng?", "opts": ["Phương pháp luận sử học, các phương pháp cụ thể", "Phương pháp lịch sử", "Phương pháp logic", "Các phương pháp khác"], "c": 0}, {"n": 10, "ch": 1, "label": "Chương 1 · câu 10", "q": "Nghiên cứu, giảng dạy, học tập lịch sử Đảng Cộng sản Việt Nam cần chú trọng phương pháp:", "opts": ["Vận dụng vào công việc bản thân", "Thực hành", "Nắm vững lý thuyết", "Vận dụng lý luận vào thực tiễn"], "c": 3}, {"n": 11, "ch": 1, "label": "Chương 1 · câu 11", "q": "Những giai cấp bị trị ở Việt Nam dưới chế độ thuộc địa của đế quốc Pháp là:", "opts": ["Công nhân, nông dân, tiểu tư sản, tư sản dân tộc, địa chủ vừa và nhỏ.", "Công nhân và nông dân.", "Công nhân, nông dân, tiểu tư sản.", "Công nhân, nông dân, tiểu tư sản, tư sản dân tộc."], "c": 0}, {"n": 12, "ch": 1, "label": "Chương 1 · câu 12", "q": "Thực dân Pháp nổ súng tấn công xâm lược Việt Nam khi nào?", "opts": ["31/8/1858", "31/12/1858", "6/6/1884", "1/9/1858"], "c": 0}, {"n": 13, "ch": 1, "label": "Chương 1 · câu 13", "q": "Dưới chế độ cai trị của chủ nghĩa thực dân, nhân dân Việt Nam có yêu cầu bức thiết nhất là gì?", "opts": ["Độc lập dân tộc", "Ruộng đất", "Quyền bình đẳng nam, nữ", "Được giảm tô, giảm tức"], "c": 0}, {"n": 14, "ch": 1, "label": "Chương 1 · câu 14", "q": "Nguyễn Ái Quốc lựa chọn con đường giải phóng dân tộc theo khuynh hướng chính trị vô sản vào thời gian nào?", "opts": ["1920", "1917", "1918", "1919"], "c": 0}, {"n": 15, "ch": 1, "label": "Chương 1 · câu 15", "q": "Tên của  đều đúng"], "c": 1}, {"n": 217, "ch": 3, "label": "Chương 3 · câu 11", "q": "Những sai lầm trong nhận thức và chủ trương công nghiệp hóa từ năm 1960 đến năm 1985 được đưa ra tại Đại hội lần thứ mấy của Đảng?", "opts": ["VI", "VII", "VIII", "IX"], "c": 0}, {"n": 218, "ch": 3, "label": "Chương 3 · câu 12", "q": "Quan điểm của Đảng ta về vấn đề CNH,HĐH trong thời kỳ đổi mới?", "opts": ["Khoa học và công nghệ là yếu tố cơ bản cho sự phát triển nhanh nền kinh tế nước ta.", "Tăng trưởng kinh tế không phải lúc nào cũng đi đôi với thực hiện tiến bộ và công bằng xã hội.", "CNH,HĐH gắn với phát triển kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập kinh tế quốc tế.", "Cả 3 câu đều đúng"], "c": 2}, {"n": 219, "ch": 3, "label": "Chương 3 · câu 13", "q": "Cách mạng xã hội chủ nghĩa được bắt đầu xây dựng trên phạm vi cả nước kể từ năm nào?", "opts": ["Tháng 12/1960", "Tháng 5/1954", "Tháng 4/1975", "Tháng 12/1986"], "c": 2}, {"n": 220, "ch": 3, "label": "Chương 3 · câu 14", "q": "Mục tiêu cách mạng xã hội chủ nghĩa ở miền Bắc được xác định tại Đại hội đại biểu toàn quốc lần III của Đảng (9/1960)?", "opts": ["Đưa miền Bắc tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội", "Củng cố miền Bắc trở thành cơ sở vững mạnh cho cuộc đấu tranh thống nhất nước nhà.", "Đẩy mạnh phát triển công nghiệp nặng, tiến lên chủ nghĩa xã hội", "Đưa miền Bắc tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã"], "c": 3}, {"n": 221, "ch": 3, "label": "Chương 3 · câu 15", "q": "hội, xây dựng đời sống ấm no, hạnh phúc ở miền Bắc, củng cố miền Bắc trở thành cơ sở vững mạnh cho cuộc đấu tranh thống nhất nước nhà. Câu 15. Mục tiêu cơ bản của công nghiệp hóa xã hội chủ nghĩa được xác định tại Đại hội đại biểu toàn quốc lần thứ III của Đảng (9/1960)?", "opts": ["Xây dựng một nền kinh tế xã hội chủ nghĩa cân đối và hiện đại", "bước đầu xây dựng cơ sở vật chất và kỹ thuật của chủ nghĩa xã hội", "Đưa nước ta tiến nhanh, mạnh lên chủ nghĩa xã hội", "Xây dựng một nền kinh tế xã hội chủ nghĩa cân đối và hiện đại; bước"], "c": 3}, {"n": 222, "ch": 3, "label": "Chương 3 · câu 16", "q": "đầu xây dựng cơ sở vật chất và kỹ thuật của chủ nghĩa xã hội. Câu 16. Cho biết những mốc chính trong tiến trình thực hiện công nghiệp hóa xã hội chủ nghĩa giai đoạn trước đổi mới?", "opts": ["1960 - 1975: Công nghiệp hóa xã hội chủ nghĩa ở miền Bắc", "1960 - 1975: Công nghiệp hóa xã hội chủ nghĩa ở miền Bắc và 1975 - 1985: Công nghiệp hóa xã hội chủ nghĩa trên phạm vi cả nước", "1975 - 1985: Công nghiệp hóa xã hội chủ nghĩa trên phạm vi cả nước", "1986 đến nay"], "c": 1}, {"n": 223, "ch": 3, "label": "Chương 3 · câu 17", "q": "Đặc điểm lớn nhất chi phối sự hình thành đường lối công nghiệp hóa của Đảng từ năm 1960 đến năm 1975?", "opts": ["Nền kinh tế nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội", "Phát triển nền kinh tế tri thức", "Nền kinh tế nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội không trải qua giai đoạn phát triển tư bản chủ nghĩa", "Tất cả đều sai"], "c": 2}, {"n": 224, "ch": 3, "label": "Chương 3 · câu 18", "q": "Tính tất yếu của công nghiệp hóa xã hội chủ nghĩa được xác định tại Đại hội đại biểu toàn quốc lần thứ III của Đảng (9/1960)?", "opts": ["Công nghiệp hóa là quy luật khách quan", "Công nghiệp hóa là động lực cho sự phát triển đất nước", "Muốn cải biến tình trạng kinh tế lạc hậu của nước ta, không có con đường nào khác, ngoài con đường công nghiệp hóa xã hội chủ nghĩa.", "Công nghiệp hóa là con đường giúp đất nước ta thoát khỏi khủng hoảng"], "c": 2}, {"n": 225, "ch": 3, "label": "Chương 3 · câu 19", "q": "Kỳ họp thứ nhất của Quốc hội nước Việt Nam thống nhất (Quốc hội khoá VI) được tổ chức trong thời gian nào?", "opts": ["Từ 24/6 - 3/7/1976", "Từ 24/7 - 3/8/1976", "Từ 24/9 - 3/10/1976", "Từ 20/9 - 1/10/1976"], "c": 0}, {"n": 226, "ch": 3, "label": "Chương 3 · câu 20", "q": "Đại hội V của Đảng (3/1982) coi nội dung chính của CNH trong chặng đường đầu tiên là ?", "opts": ["Lấy nông nghiệp làm mặt trận hàng đầu, ra sức phát triển công nghiệp sản xuất hàng tiêu dùng", "Việc xây dựng và phát triển công nghiệp nặng trong giai đoạn này cần làm có mức độ, vừa sức", "Phát triển công nghiệp nặng nhằm phục vụ thiết thực, có hiệu quả cho nông nghiệp và công nghiệp nhẹ", "Cả a, b, c đều đúng"], "c": 0}, {"n": 227, "ch": 3, "label": "Chương 3 · câu 21", "q": "Một trong những đặc trưng của CNH thời kỳ trước đổi mới là ?", "opts": ["CNH theo mô hình kinh tế mở, hướng ngoại", "CNH theo mô hình kinh tế khép kín, hướng nội và thiên về công nghiệp nặng", "CNH theo mô hình các nước CNH mới (NICS) Hàn Quốc, Đài Loan, Hồng Kong, Singapore", "CNH theo mô hình các nước Tây Âu"], "c": 1}, {"n": 228, "ch": 3, "label": "Chương 3 · câu 22", "q": "Đặc trưng của CNH thời kỳ trước đổi mới là ?", "opts": ["Chủ yếu dựa vào lợi thế lao động, tài nguyên, đất đai, nguồn viện trợ của các nước XHCN", "Chủ lực thực hiện CNH là Nhà nước và các doanh nghiệp nhà nước", "Phân bố nguồn lực bằng cơ chế kế hoạch hóa tập trung quan liêu trong một nền kinh tế phi thị trường", "Cả a, b, c đều đúng"], "c": 3}, {"n": 229, "ch": 3, "label": "Chương 3 · câu 23", "q": "CNH thời kỳ trước đổi mới còn nhiều hạn chế là ?", "opts": ["Cơ sở vật chất kĩ thuật còn hết sức lạc hậu", "Những ngành công nghiệp then chốt nhỏ bé, không đồng bộ, chưa đủ sức làm nền tảng vững chắc cho nền kinh tế quốc dân", "Cơ cấu kinh tế chuyển dịch chậm, các sản phẩm có hàm lượng tri thức cao còn rất ít", "Cả a, b, c đều đúng"], "c": 3}, {"n": 230, "ch": 3, "label": "Chương 3 · câu 24", "q": "CNH thời kỳ trước đổi mới còn nhiều hạn chế xuất phát từ nguyên nhân khách quan là ?", "opts": ["Nhiều chính sách và giải pháp chưa hợp lý, chưa sử dụng tốt các nguồn lực, cả nội lực và ngoại lực", "Chế độ trách nhiệm không nghiêm, pháp chế XHCN còn nhiều thiếu sót", "CNH XHCN là hoàn toàn mới, nhận thức và lý luận chưa theo kịp thực tiễn", "CNH từ một nền kinh tế lạc hậu, nghèo nàn, chiến tranh kéo dài vừa"], "c": 3}, {"n": 231, "ch": 3, "label": "Chương 3 · câu 25", "q": "bị tàn phá nặng nề, vừa không thể tập trung sức người sức của cho CNH Câu 26: CNH HĐH là ?", "opts": ["Quá trình chuyển đổi căn bản, toàn diện các hoạt động sản xuất kinh doanh, dịch vụ, quản lý kinh tế, xã hội", "Từ lao động thủ công là chính sang sử dụng một cách phổ biến sức lao động với công nghệ, phương tiện và phương pháp tiên tiến hiện đại", "Dựa trên sự phát triển công nghiệp và tiến bộ khoa học, công nghệ, tạo ra năng suất lao động xã hội cao", "Cả a, b, c đều đúng"], "c": 3}, {"n": 232, "ch": 3, "label": "Chương 3 · câu 26", "q": "Nhìn lại đất nước ta sau 10 năm đổi mới, Đại hội VIII của Đảng (6/1996) nhận định ?", "opts": ["Nước ta đã ra khỏi khủng hoảng kinh tế xã hội", "Nước ta đã có nền kinh tế phát triển", "Nước ta đã thoát khỏi nghèo đói", "Nước ta đã chuyển sang nền kinh tế thị trường"], "c": 0}, {"n": 233, "ch": 3, "label": "Chương 3 · câu 27", "q": "Đại hội IX, X của Đảng bổ sung và nhấn mạnh một trong những điểm mới của tư duy về CNH là ?", "opts": ["Hướng CNH HĐH ở nước ta là phát triển nhanh và hiệu quả sản phẩm lâm nghiệp", "Hướng CNH HĐH ở nước ta là phát triển nhanh, hiệu quả sản phẩm dịch vụ", "Hướng CNH HĐH ở nước ta là phát triển nhanh, hiệu quả các sản phẩm, các ngành, các lĩnh vực có lợi thế, đáp ứng nhu cầu trong nước và xuất khẩu", "Cả a, b, c đều đúng"], "c": 2}, {"n": 234, "ch": 3, "label": "Chương 3 · câu 28", "q": "Đại hội X (4/2006) của Đảng đã nhận định về CNH, HĐH trong thế kỷ XXI là ?", "opts": ["Khoa học và công nghệ có bước tiến nhảy vọt", "Kinh tế tri thức có vai trò ngày càng nổi bật trong quá trình phát triển LLSX", "Khoa học và công nghệ trở thành yếu tố cơ bản của LLSX xã hội", "Cả a, b đều đúng"], "c": 3}, {"n": 235, "ch": 3, "label": "Chương 3 · câu 29", "q": "Sau 20 năm đổi m ới, bên cạnh những thành tựu to lớn đã đạt được, CNH HĐH ở nước ta vẫn còn nhiều hạn chế ?", "opts": ["Cơ cấu kinh tế chuyển dịch còn chậm", "Các vùng kinh tế trọng điểm chưa phát huy được thế mạnh để đi nhanh vào cơ cấu kinh tế hiện đại", "Cơ cấu các thành phần kinh ": 3, "label": "Chương 3 · câu 41", "q": "“Kinh tế thị trường là một nền kinh tế mà khi các …..được phân bổ bằng nguyên tắc thị trường”?", "opts": ["Điều kiện kinh tế", "Môi trường kinh tế", "Nguồn lực kinh tế", "Quan hệ kinh tế"], "c": 2}, {"n": 248, "ch": 3, "label": "Chương 3 · câu 42", "q": "Đại hội toàn quốc lần thứ V của Đảng coi mặt trận hàng đầu là?", "opts": ["Công nghệ máy móc", "Giảm mù chữ", "Ngoại giao các nước", "Nông nghiệp"], "c": 3}, {"n": 249, "ch": 3, "label": "Chương 3 · câu 43", "q": "Đại hội lần thứ VIII đã chủ trương?", "opts": ["Gắn thị trường trong nước và xuất khẩu", "Xây dựng nền kinh tế mở; đẩy nhanh quá trình hội nhập kinh tế khu vực và thế giới", "Đẩy nhanh quá trình hòa nhập kinh tế khu vực", "Xây dựng nền kinh tế mở cửa đón nhận tất cả những thành quả của CNTB"], "c": 1}, {"n": 250, "ch": 3, "label": "Chương 3 · câu 44", "q": "Đại hội đại biểu toàn quốc lần thứ X của Đảng (4/2006) đã xác định vai trò của kinh tế tri thức như thế nào?", "opts": ["Kinh tế tri thức là yếu tố quan trọng của nền kinh tế và công nghiệp hóa, hiện đại hoá.", "Kinh tế tri thức là điều kiện cần cho sự nghiệp công nghiệp hóa, hiện đại hoá.", "Kinh tế tri thức là đặc điểm cơ bản của nền kinh tế và công nghiệp hóa, hiện đại hoá.", "Tất cả đều đúng"], "c": 0}, {"n": 251, "ch": 3, "label": "Chương 3 · câu 45", "q": "Tư duy của Đảng về kinh tế thị trường từ Đại hội đại biểu toàn quốc lần thứ VI đến Đại hội đại biểu toàn quốc lần thứ VIII?", "opts": ["Kinh tế thị trường là sản phẩm của chủ nghĩa tư bản", "Kinh tế thị trường tồn tại khách quan trong xã hội phong kiến", "Kinh tế thị trường không phải là cái riêng của chủ nghĩa tư bản mà là thành tựu phát triển chung của nhân loại; Kinh tế thị trường còn tồn tại khách quan trong thời kì quá độ lên chủ nghĩa xã hội; Có thể và cần thiết sử dụng kinh tế thị trường để xây dựng chủ nghĩa xã hội ở nước ta", "Tất cả đều sai"], "c": 2}, {"n": 252, "ch": 3, "label": "Chương 3 · câu 46", "q": "Đại hội VI xác định yếu tố có vị trí then chốt trong sự nghiệp xây dựng CNXH?", "opts": ["Giáo dục", "An Ninh", "Khoa học-Kỹ thuật", "Bảo vệ chủ quyền dân tộc"], "c": 2}, {"n": 253, "ch": 3, "label": "Chương 3 · câu 47", "q": "Đại hội nào đề cập đến sự cần thiết đổi mới cơ chế quản lý kinh tế?", "opts": ["Đại hội V", "Đại hội VI", "Đại hội VII", "Đại hội VIII"], "c": 1}, {"n": 254, "ch": 3, "label": "Chương 3 · câu 48", "q": "Đại hội nào của Đảng chủ trương phải kết hợp các mục tiêu kinh tế với các mục tiêu xã hội trong phạm vi cả nước, ở từng lĩnh vực, địa phương ?", "opts": ["Đại hội VIII", "Đại hội IX", "Đại hội X", "Đại hội XI"], "c": 2}, {"n": 255, "ch": 3, "label": "Chương 3 · câu 49", "q": "Đại hội đại biểu toàn quốc lần thứ VII (1991) của Đảng họp ở đâu?", "opts": ["Hà Nội", "Cao Bằng", "Hương Cảng (Trung Quốc)", "Sài Gòn"], "c": 0}, {"n": 256, "ch": 3, "label": "Chương 3 · câu 50", "q": "Dựa trên học thuyết chủ nghĩa Mác-Lênin về thời kỳ quá độ, đường lối và chính sách của Việt Nam trong thời kỳ 1955-1975 được xác định tại đại hội Đảng lần thứ III là:", "opts": ["Tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội", "Tiến thẳng lên chủ nghĩa xã hội", "Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước", "Tất cả đều sai"], "c": 0}, {"n": 257, "ch": 3, "label": "Chương 3 · câu 51", "q": "Việt Nam gia nhập tổ chức ASEAN trong khu vực vào ngày tháng năm nào?", "opts": ["28/07/1995", "27/08/1995", "16/03/1993", "28/07/1997"], "c": 0}, {"n": 258, "ch": 3, "label": "Chương 3 · câu 52", "q": "Về phương châm đối ngoại của Việt Nam, từ năm 1945 khi nhà nước dân chủ nhân dân ra đời. Trong điều kiện trực tiếp lãnh đạo chính quyền, Đảng đã hoạch định đường lối đối ngoại với nội dung nào?", "opts": ["Độc lập, tự do", "Tự lực cánh sinh", "Độc lập, tự chủ, tự lực, tự cường", "Tự lực, tự cường"], "c": 2}, {"n": 259, "ch": 3, "label": "Chương 3 · câu 53", "q": "Mục tiêu đối ngoại của nước ta là gì?", "opts": ["Nhằm phát triển đất nước trên mọi lĩnh vực", "Thúc đẩy kinh tế trong nước phát triển", "Nâng cao vị thế trong quan hệ ngoại giao khu vực và quốc tế.", "Hội nhập với các nước trên thế giới"], "c": 2}, {"n": 260, "ch": 3, "label": "Chương 3 · câu 54", "q": "Sự kiện nào đánh dấu sự hội nhập của nước ta với các nước trong khu vực Đông Nam Á?", "opts": ["Tháng 7/1995 Việt Nam gia nhập ASEAN", "Năm 1976 Việt Nam đặt quan hệ ngoại giao cuối cùng với Thái Lan và Philipin", "Năm 1986 Việt Nam đồng ý cho các nước Đông Nam Á vào buôn bán.", "Cả 3 đều đúng"], "c": 0}, {"n": 261, "ch": 3, "label": "Chương 3 · câu 55", "q": "Phương châm của Đại hội Đảng lần thứ IX: “Việt Nam ….là bạn, là ……của các nước trong cộng đồng quốc tế, phấn đấu vì hòa bình, độc lập và phát triển”.", "opts": ["Sẵn sàng - đối tác tin cậy", "Muốn - đối tác", "Đã, đang và sẽ - đối tác tin cậy", "Chấp nhận - đối"], "c": 0}, {"n": 262, "ch": 3, "label": "Chương 3 · câu 56", "q": "tác Câu 57: Chủ trương đối ngoại của Đại hội VIII có những đặc điểm mới hơn so với đại hội lần thứ VII là gì?", "opts": ["Thu hút vốn đầu tư nước ngoài ngày càng nhiều", "Xuất khẩu lương thực, thực phẩm, hàng tiêu dùng", "Mở rộng quan hệ với Đảng cầm quyền và các Đảng khác; quán triệt yêu cầu mở rộng quan hệ đối ngoại nhân dân, quan hệ với các tổ chức phi chính phủ; thử nghiệm tiến tới đầu tư ra nước ngoài.", "Quan hệ chặt chẽ giữa Việt Nam và Hoa Kỳ"], "c": 2}, {"n": 263, "ch": 3, "label": "Chương 3 · câu 57", "q": "Hơn 20 năm thực hiện đường lối mở rộng quan hệ đối ngoại, hội nhập quốc tế nước ta đạt được kết quả?", "opts": ["Phá thế bị bao vây cấm vận của các thế lực thù địch", "Giải quyết hòa bình các vấn đề biên giới, lãnh thổ", "Mở rộng quan hệ đối ngoại theo hướng đa phương hóa, đa dạng hóa", "Tất cả đều đúng"], "c": 3}];
const $ = id => document.getElementById(id);
const L = ["A","B","C","D"];
let store = {wrong:[],best:{}};
try{ const s=localStorage.getItem("lsdang"); if(s) store=Object.assign(store,JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem("lsdang",JSON.stringify(store)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const pinned = o => /(tất cả|cả\s*(3|ba|hai)|cả .*đều|\b[a-d] và [a-d]\b)/i.test(o);

let deck=[], idx=0, right=0, streak=0, bestStreak=0, answered=false, missed=[], mode="";

function home(){
  $("game").classList.add("hidden"); $("end").classList.add("hidden"); $("menu").classList.remove("hidden");
  const w=store.wrong.length;
  $("wrongMode").classList.toggle("hidden", w===0);
  $("wrongCount").textContent = w+" câu đang cần ôn lại.";
  const b=Object.entries(store.best).map(([k,v])=>k+": "+v+"%").join("  |  ");
  $("best").textContent = b ? "Điểm cao nhất – "+b : "";
}
function start(m){
  mode=m;
  let ids;
  if(m==="seq") ids=Q.map(q=>q.n);
  else if(m==="wrong") ids=shuffle(store.wrong);
  else if(/^ch\d$/.test(m)) ids=shuffle(Q.filter(q=>q.ch===+m[2]).map(q=>q.n));
  else if(m==="all") ids=shuffle(Q.map(q=>q.n));
  else ids=shuffle(Q.map(q=>q.n)).slice(0,+m);
  deck=ids.map(n=>{
    const q=Q.find(x=>x.n===n);
    let order=q.opts.map((_,i)=>i);
    if(m!=="seq" && !q.opts.some(pinned)) order=shuffle(order);
    return {n:q.n,label:q.label,q:q.q,opts:order.map(i=>q.opts[i]),c:order.indexOf(q.c)};
  });
  idx=0; right=0; streak=0; bestStreak=0; missed=[];
  $("menu").classList.add("hidden"); $("end").classList.add("hidden"); $("game").classList.remove("hidden");
  show();
}
function show(){
  answered=false;
  const d=deck[idx];
  $("prog").textContent="Câu "+(idx+1)+"/"+deck.length;
  $("barfill").style.width=(idx/deck.length*100)+"%";
  $("sc").textContent=right+" đúng";
  $("st").textContent=streak>=2?"Chuỗi "+streak:"";
  $("qno").textContent=d.label;
  $("qtext").textContent=d.q;
  $("fb").textContent=""; $("fb").className="fb";
  $("next").classList.add("hidden");
  const box=$("opts"); box.innerHTML="";
  d.opts.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.i=i;
    const k=document.createElement("span"); k.className="k"; k.textContent=L[i];
    const s=document.createElement("span"); s.textContent=t;
    b.append(k,s); b.onclick=()=>pick(i); box.append(b);
  });
}
function pick(i){
  if(answered) return; answered=true;
  const d=deck[idx], btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.disabled=true);
  btns[d.c].classList.add("ok");
  if(i===d.c){
    right++; streak++; bestStreak=Math.max(bestStreak,streak);
    $("fb").textContent="Chính xác!"; $("fb").className="fb ok";
    store.wrong=store.wrong.filter(n=>n!==d.n);
  } else {
    btns[i].classList.add("bad"); streak=0;
    $("fb").textContent="Chưa đúng. Đáp án đúng là "+L[d.c]+".";
    $("fb").className="fb bad";
    missed.push({d,pick:i});
    if(!store.wrong.includes(d.n)) store.wrong.push(d.n);
  }
  save();
  $("sc").textContent=right+" đúng";
  $("st").textContent=streak>=2?"Chuỗi "+streak:"";
  $("next").textContent = idx===deck.length-1 ? "Xem kết quả" : "Câu tiếp";
  $("next").classList.remove("hidden"); $("next").focus();
}
function next(){ if(idx<deck.length-1){idx++;show();} else finish(); }
function finish(){
  $("game").classList.add("hidden"); $("end").classList.remove("hidden");
  const pct=Math.round(right/deck.length*100);
  $("barfill").style.width="100%";
  $("endTitle").textContent = pct>=90?"Xuất sắc!":pct>=70?"Khá tốt!":pct>=50?"Cố thêm chút nữa":"Cần ôn thêm";
  $("endScore").textContent=right+" / "+deck.length;
  $("endSub").textContent=pct+"% đúng. Chuỗi đúng dài nhất: "+bestStreak+".";
  if(mode!=="wrong"){ const key=mode==="seq"?"Theo thứ tự":mode==="all"?"Cả đề":/^ch\d$/.test(mode)?"Chương "+mode[2]:mode+" câu"; if(!store.best[key]||pct>store.best[key]) store.best[key]=pct; save(); }
  $("retryWrong").classList.toggle("hidden", store.wrong.length===0);
  const rev=$("rev"); rev.innerHTML="";
  missed.forEach(({d,pick})=>{
    const el=document.createElement("div"); el.className="item";
    const q=document.createElement("div"); q.innerHTML="<small></small>"; q.firstChild.textContent=d.label; 
    const t=document.createElement("div"); t.style.fontWeight="700"; t.textContent=d.q;
    const a=document.createElement("div"); a.innerHTML='<span class="n">Bạn chọn: </span>'; a.append(document.createTextNode(d.opts[pick]));
    const c=document.createElement("div"); c.innerHTML='<span class="y">Đáp án đúng: </span>'; c.append(document.createTextNode(d.opts[d.c]));
    el.append(q,t,a,c); rev.append(el);
  });
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.mode));
$("next").onclick=next;
$("quit").onclick=()=>{ if(confirm("Thoát lượt chơi này?")) home(); };
$("again").onclick=()=>start(mode);
$("retryWrong").onclick=()=>start("wrong");
$("home").onclick=home;
document.addEventListener("keydown",e=>{
  if($("game").classList.contains("hidden")) return;
  const k=e.key.toUpperCase(); const i="ABCD".indexOf(k)>=0?"ABCD".indexOf(k):("1234".indexOf(k));
  if(i>=0 && i<deck[idx].opts.length && !answered){ pick(i); }
  else if(e.key==="Enter" && answered){ e.preventDefault(); next(); }
});
home();
</script>
</body>
</html>
